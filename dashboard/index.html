<style>
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;

  --c1: #e2ecf9; --c2: #c4dbf6; --c3: #97c0f1; --c4: #5f9de8;
}

  :root:not([data-theme="light"]) {

    --s1t: #17324f; --s2t: #4a2516; --s1s: #1f4f87; --s2s: #7a3415;
    --c1: #172a40; --c2: #183f6b; --c3: #1d5598; --c4: #2a78d6;
  }
}

  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: #2c2c2a;
  --t1: #2a78d6; --t2: #143e70; --t3: #262624;
  --s1: #3987e5; --s2: #d95926; --accent: #86b6ef; --warn-bg: #2e2614;
    --s1t: #17324f; --s2t: #4a2516; --s1s: #1f4f87; --s2s: #7a3415;
    --c1: #172a40; --c2: #183f6b; --c3: #1d5598; --c4: #2a78d6;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
main { max-width: 1240px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.brand { color: var(--ink); flex: none; display: block; }
.brand svg { height: 52px; width: auto; display: block; }
header > div { min-width: 0; }
@media (max-width: 640px) { header { flex-direction: column-reverse; gap: 12px; } .brand svg { height: 40px; } }
header h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.01em; }
header p { margin: 0; color: var(--ink-2); max-width: 820px; }
.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 20px 0 12px; }
.sister-link { margin: 6px 0 0; font-size: 13px; }
.sister-link a { color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; color: var(--ink-2); padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.label { font-size: 12px; color: var(--muted); margin-right: 4px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.card h2 { font-size: 16px; margin: 0 0 8px; }
.note { font-size: 13px; color: var(--ink-2); }
.empty { background: var(--warn-bg); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.matrix { border-collapse: separate; border-spacing: 2px; font-size: 13px; min-width: 100%; }
.matrix th, .matrix td { padding: 6px 8px; text-align: right; white-space: nowrap; border-radius: 4px; }
.matrix thead th { color: var(--ink-2); font-weight: 600; font-size: 12px; vertical-align: bottom; }
.matrix thead tr.grp th { color: var(--muted); font-weight: 500; text-align: left; border-bottom: 1px solid var(--axis); border-radius: 0; }
.matrix th.lang { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; }
.matrix td { font-variant-numeric: tabular-nums; background: var(--t3); }
.matrix td.c1 { background: var(--c1); } .matrix td.c2 { background: var(--c2); } .matrix td.c3 { background: var(--c3); } .matrix td.c4 { background: var(--c4); }
.matrix td.na { background: transparent; color: var(--muted); }
.matrix td.sb { background: var(--s1t); } .matrix td.ob { background: var(--s2t); }
.matrix td.sb2 { background: var(--s1s); } .matrix td.ob2 { background: var(--s2s); }
.ramp { display: inline-flex; gap: 2px; vertical-align: -2px; margin: 0 4px; } .ramp .sw { margin: 0; }
.matrix th.mh { text-align: center; color: var(--muted); font-weight: 500; }
.matrix td.score { font-weight: 700; }
.matrix small { color: var(--ink-2); font-weight: 400; margin-left: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--ink-2); align-items: center; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid var(--border); }
details.adv { margin-top: 12px; } details.adv summary { cursor: pointer; font-size: 13px; color: var(--ink-2); }
.weights { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 18px; margin-top: 8px; }
.weights label { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
.weights input { width: 96px; accent-color: var(--accent); }
.weights output { width: 14px; text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.link-btn { border: 1px solid var(--border); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
select { font: inherit; font-size: 13px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); }
svg text { fill: var(--ink-2); font-size: 12px; }
svg .grid { stroke: var(--grid); } svg .axis { stroke: var(--axis); }
#tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--page); font-size: 12px; padding: 6px 8px; border-radius: 6px; opacity: 0; transition: opacity .1s; max-width: 260px; z-index: 10; }
table.plain { border-collapse: collapse; font-size: 13px; }
.plain th, .plain td { text-align: left; padding: 4px 12px 4px 0; border-bottom: 1px solid var(--border); }
footer { font-size: 13px; color: var(--ink-2); }
footer a, .note a { color: var(--accent); }

const LANG_UI = [["en", "EN"], ["ko", "KO"], ["ja", "JA"], ["zh", "中文"]];
const qTheme = new URLSearchParams(location.search).get("theme");
if (qTheme === "light" || qTheme === "dark") document.documentElement.dataset.theme = qTheme;
const B = window.BENCH;
const metrics = B.metrics;
const PCT = new Set(["pass_rate", "followup_pass", "error_rate", "soak_error_rate"]);
const RATIO = new Set(["pass_rate", "followup_pass"]); // 0-1로 저장, %로 표시
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const state = {
  ui: store.get("lb.ui", (navigator.language || "en").slice(0, 2)),
  model: store.get("lb.model", "compare"),
  metric: "rps",
  preset: store.get("lb.preset", "prereg"),
};
if (state.model === "all") state.model = "compare"; // 이전 버전의 "두 모델 평균" 선택값
if (!["prereg", "balanced", "speed", "perf", "maintain"].includes(state.preset)) state.preset = "prereg";
state.weights = Score.presetWeights(state.preset, metrics);
const PRESETS = ["prereg", "balanced", "speed", "perf", "maintain"];
const compare = () => state.model === "compare";
if (!T[state.ui]) state.ui = "en";
const t = () => T[state.ui];
const label = (m) => m[state.ui] || m.en;
const tip = document.getElementById("tip");

function fmt(m, v) {
  if (v === null || v === undefined) return "—";
  if (RATIO.has(m.key)) return Math.round(v * 100) + "%";
  if (PCT.has(m.key)) return (+v).toFixed(2) + "%";
  if (m.unit === "USD") return "$" + v.toFixed(2);
  const a = Math.abs(v);
  const s = Number.isInteger(v) ? v.toLocaleString() : a >= 100 ? Math.round(v).toLocaleString() : a >= 10 ? v.toFixed(1) : v.toFixed(2);
  return m.unit && !["%", "USD"].includes(m.unit) ? s + " " + m.unit : s;
}
function showTip(e, html) { tip.innerHTML = html; tip.style.opacity = 1; moveTip(e); }
function moveTip(e) { tip.style.left = Math.min(e.clientX + 12, innerWidth - 270) + "px"; tip.style.top = e.clientY + 12 + "px"; }
function hideTip() { tip.style.opacity = 0; }
function bindTip(el, html) {
  el.addEventListener("mouseenter", (e) => showTip(e, html));
  el.addEventListener("mousemove", moveTip);
  el.addEventListener("mouseleave", hideTip);
}
function evidenceAction(el, selection, description) {
  el.setAttribute('tabindex', '0'); el.setAttribute('role', 'button');
  el.setAttribute('aria-label', description);
  el.addEventListener('click', () => DecisionUI.open(selection));
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); DecisionUI.open(selection); }
  });
}
function seg(el, items, current, onPick) {
  el.innerHTML = "";
  for (const [k, name] of items) {
    const b = document.createElement("button");
    b.textContent = name; b.setAttribute("aria-pressed", k === current); b.dataset.choice = k;
    b.onclick = () => { onPick(k); [...el.querySelectorAll('button')].find(button => button.dataset.choice === k)?.focus({preventScroll:true}); };
    el.appendChild(b);
  }
}
const cellsOf = (model) => Object.fromEntries(B.languages.map((l) => [l.key, B.cells[l.key][model]]));
const cellsFor = () => cellsOf(state.model);
const [MA, MB] = B.models.map((m) => m.key); // 비교 모드의 a(Sonnet), b(Opus)
// 현재 보기에서 모든 언어가 같은 값인 지표. 표·run별 상세에서 숨기고 종합 점수에서도 뺀다(순위 정보가 없고 점수 차만 줄인다).
const hiddenKeys = () => Score.constantMetrics(compare() ? [cellsOf(MA), cellsOf(MB)] : [cellsFor()], metrics);
const effWeights = () => { const h = hiddenKeys(); return Object.fromEntries(Object.entries(state.weights).map(([k, w]) => [k, h.includes(k) ? 0 : w])); };
const followupDeviation = (language, model, key) => language === 'cpp' && model === 'sonnet55' && key === 'followup_pass' && B.runs.some(r => r.exp === 'EXP-001' && r.run === 'sonnet55-cpp-3') ? ' †' : '';

function renderText() {
  document.documentElement.lang = state.ui === "zh" ? "zh-CN" : state.ui;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t()[el.dataset.t].replaceAll("{n}", B.languages.length); });
  document.getElementById("generated").textContent = B.generated.replace("T", " ").replace("+00:00", " UTC");
  document.getElementById("empty").hidden = B.runs.length > 0;
  seg(document.getElementById("langSeg"), LANG_UI, state.ui, (k) => { state.ui = k; store.set("lb.ui", k); render(); });
  seg(document.getElementById("modelSeg"), [...B.models.map((m) => [m.key, m.name]), ["compare", t().both]], state.model,
    (k) => { state.model = k; store.set("lb.model", k); render(); });
}

function renderMatrix() {
  const hidden = hiddenKeys();
  const shown = metrics.filter((m) => !hidden.includes(m.key));
  const hiddenNote = hidden.length
    ? `<span>${t().hidden} ${hidden.map((k) => label(metrics.find((m) => m.key === k))).join(", ")}</span>` : "";
  if (compare()) return renderCompare(shown, hiddenNote);
  const cells = cellsFor();
  const langs = B.languages;
  const score = Score.composite(cells, metrics, effWeights());
  const groups = ["process", "product", "maintain"].filter((g) => shown.some((m) => m.group === g));
  let h = '<thead><tr class="grp"><th class="lang"></th><th></th>';
  for (const g of groups) h += `<th colspan="${shown.filter((m) => m.group === g).length}">${t().grp[g]}</th>`;
  h += '</tr><tr><th class="lang"></th><th>' + t().score + "</th>";
  for (const g of groups) for (const m of shown.filter((x) => x.group === g)) h += `<th>${label(m)}</th>`;
  h += "</tr></thead><tbody>";
  // 값이 2개 이상이고 서로 다를 때만 칠한다(전부 같으면 순위가 없다)
  // 열 안의 정규화 값(0 최하-1 최상)을 5단계로 칠한다. c0(바탕색)이 최하, c4가 최상
  const tier = (v, distinct) => (v === null || distinct < 2 ? "" : "c" + Math.round(v * 4)).replace("c0", "");
  const distinctOf = (vals) => new Set(vals.filter((v) => v !== null)).size;
  const scoreVals = langs.map((l) => score[l.key]);
  const scoreNorm = Score.normalize(scoreVals, "higher");
  const scoreCount = distinctOf(scoreVals);
  const ordered = groups.flatMap((g) => shown.filter((m) => m.group === g));
  const norms = Object.fromEntries(ordered.map((m) => {
    const vals = langs.map((l) => cells[l.key][m.key]);
    return [m.key, { norm: Score.normalize(vals, m.better), count: distinctOf(vals) }];
  }));
  langs.forEach((l, i) => {
    const c = cells[l.key];
    h += `<tr><th class="lang">${l.name}${expBadge(l)}</th>`;
    const sv = score[l.key];
    h += `<td class="score ${sv === null ? "na" : tier(scoreNorm[i], scoreCount)}">${sv === null ? "—" : Math.round(sv * 100)}</td>`;
    for (const m of ordered) {
      const v = c[m.key];
      const lab = Score.sampleLabel(c, m);
      const sample = lab ? `<small>${lab}</small>` : "";
      const cls = v === null ? "na" : tier(norms[m.key].norm[i], norms[m.key].count);
      h += `<td class="${cls}" data-l="${l.key}" data-m="${m.key}">${fmt(m, v)}${followupDeviation(l.key,state.model,m.key)}${sample}</td>`;
    }
    h += "</tr>";
  });
  const table = document.getElementById("matrix");
  table.innerHTML = h + "</tbody>";
  table.querySelectorAll("td[data-m]").forEach((td) => {
    const m = metrics.find((x) => x.key === td.dataset.m);
    const c = cells[td.dataset.l];
    const dir = m.better === "higher" ? "↑" : "↓";
    bindTip(td, `<b>${B.languages.find((l) => l.key === td.dataset.l).name} · ${label(m)}</b><br>${fmt(m, c[m.key])} (${dir})<br>runs ${c.passed}/${c.n}`);
    evidenceAction(td, {language:td.dataset.l, model:state.model, metric:m.key}, `${td.dataset.l} · ${label(m)} · ${fmt(m,c[m.key])}`);
  });
  document.getElementById("legend").innerHTML =
    `<span>${t().legendLow}<span class="ramp">${["t3", "c1", "c2", "c3", "c4"].map((c) => `<i class="sw" style="background:var(--${c})"></i>`).join("")}</span>${t().legendBest}</span>` +
    `<span>${t().legendNa} · ↑/↓</span>` + hiddenNote;
}

// 두 모델 비교: 칸마다 Sonnet · Opus 값과 Sonnet 대비 Opus 변화율. 더 나은 모델 색으로 칠한다.
function renderCompare(shown, hiddenNote) {
  const A = cellsOf(MA), Bc = cellsOf(MB);
  const langs = B.languages;
  const sa = Score.composite(A, metrics, effWeights()), sb = Score.composite(Bc, metrics, effWeights());
  const ra = Score.ranks(sa), rb = Score.ranks(sb);
  const nameA = B.models[0].name, nameB = B.models[1].name;
  const groups = ["process", "product", "maintain"].filter((g) => shown.some((m) => m.group === g));
  let h = '<thead><tr class="grp"><th class="lang"></th><th colspan="2"></th>';
  for (const g of groups) h += `<th colspan="${shown.filter((m) => m.group === g).length}">${t().grp[g]}</th>`;
  h += `</tr><tr><th class="lang"></th><th>${t().score}<br>${nameA}</th><th>${t().score}<br>${nameB}</th>`;
  const ordered = groups.flatMap((g) => shown.filter((m) => m.group === g));
  for (const m of ordered) h += `<th>${label(m)}</th>`;
  h += "</tr></thead><tbody>";
  // 차이가 20% 이상이면 짙은 색. 변화율을 못 구하면(기준값 0) 짙게 둔다.
  const strength = (cls, d) => (d.pct === null || Math.abs(d.pct) >= 20 ? cls + "2" : cls);
  const sc = (v, r) => (v === null ? "—" : `${Math.round(v * 100)} <small>#${r}</small>`);
  langs.forEach((l) => {
    const d = Score.modelDiff(sa[l.key], sb[l.key], "higher");
    h += `<tr><th class="lang">${l.name}${expBadge(l)}</th>`;
    h += `<td class="score ${d.better === "a" ? strength("sb", d) : ""}">${sc(sa[l.key], ra[l.key])}</td>`;
    h += `<td class="score ${d.better === "b" ? strength("ob", d) : ""}">${sc(sb[l.key], rb[l.key])}</td>`;
    for (const m of ordered) {
      const a = A[l.key][m.key], b = Bc[l.key][m.key];
      const df = Score.modelDiff(a, b, m.better);
      const cls = a === null && b === null ? "na" : df.better === "a" ? strength("sb", df) : df.better === "b" ? strength("ob", df) : "";
      const pct = df.pct === null || df.pct === 0 ? "" : `<small>${df.pct > 0 ? "+" : "−"}${Math.abs(df.pct) >= 100 ? Math.round(Math.abs(df.pct)) : Math.abs(df.pct).toFixed(0)}%</small>`;
      h += `<td class="${cls}" data-l="${l.key}" data-m="${m.key}">${fmt(m, a)}${followupDeviation(l.key,MA,m.key)} · ${fmt(m, b)}${followupDeviation(l.key,MB,m.key)}${pct}</td>`;
    }
    h += "</tr>";
  });
  const table = document.getElementById("matrix");
  table.innerHTML = h + "</tbody>";
  table.querySelectorAll("td[data-m]").forEach((td) => {
    const m = metrics.find((x) => x.key === td.dataset.m);
    const dir = m.better === "higher" ? "↑" : "↓";
    bindTip(td, `<b>${B.languages.find((l) => l.key === td.dataset.l).name} · ${label(m)}</b> (${dir})<br>` +
      `${nameA}: ${fmt(m, A[td.dataset.l][m.key])}<br>${nameB}: ${fmt(m, Bc[td.dataset.l][m.key])}`);
    evidenceAction(td, {language:td.dataset.l, model:MA, metric:m.key}, `${td.dataset.l} · ${label(m)} · ${nameA}: ${fmt(m,A[td.dataset.l][m.key])} · ${nameB}: ${fmt(m,Bc[td.dataset.l][m.key])}`);
  });
  document.getElementById("legend").innerHTML =
    `<span><span class="ramp"><i class="sw" style="background:var(--s1t)"></i><i class="sw" style="background:var(--s1s)"></i></span>${t().sBetter}</span>` +
    `<span><span class="ramp"><i class="sw" style="background:var(--s2t)"></i><i class="sw" style="background:var(--s2s)"></i></span>${t().oBetter}</span>` +
    `<span>${t().diffScale}</span>` +
    `<span><i class="sw" style="background:var(--t3)"></i>${t().same}</span>` +
    `<span>${t().diffNote} · — ${t().legendNa.replace(/^— /, "")}</span>` + hiddenNote;
}

// 모델별 순위 기울기 그래프(비교 모드에서만)
function renderRank() {
  const card = document.getElementById("rankCard");
  card.hidden = !compare();
  if (!compare()) return;
  const svg = document.getElementById("rank");
  const sa = Score.composite(cellsOf(MA), metrics, effWeights()), sb = Score.composite(cellsOf(MB), metrics, effWeights());
  const ra = Score.ranks(sa), rb = Score.ranks(sb);
  const n = B.languages.length, rowH = 36, top = 34;
  const W = Math.max(svg.clientWidth || 600, 320), H = top + rowH * n;
  const xa = Math.min(220, W * 0.32), xb = W - Math.min(220, W * 0.32);
  svg.setAttribute("height", H); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const NS = "http://www.w3.org/2000/svg";
  svg.innerHTML = "";
  const add = (tag, attrs, text) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); if (text !== undefined) el.textContent = text; svg.appendChild(el); return el; };
  const y = (r) => top + rowH * (r - 1) + rowH / 2;
  add("text", { x: xa, y: 16, "text-anchor": "middle", "font-weight": 600 }, B.models[0].name);
  add("text", { x: xb, y: 16, "text-anchor": "middle", "font-weight": 600 }, B.models[1].name);
  for (const l of B.languages) {
    if (ra[l.key] === null || rb[l.key] === null) continue;
    const ya = y(ra[l.key]), yb = y(rb[l.key]);
    add("line", { x1: xa + 6, y1: ya, x2: xb - 6, y2: yb, stroke: ra[l.key] === rb[l.key] ? "var(--axis)" : "var(--accent)", "stroke-width": 2 });
    add("circle", { cx: xa, cy: ya, r: 5, fill: "var(--s1)" });
    add("rect", { x: xb - 5, y: yb - 5, width: 10, height: 10, rx: 2, fill: "var(--s2)" });
    add("text", { x: xa - 12, y: ya + 4, "text-anchor": "end" }, `${ra[l.key]}. ${l.name} ${Math.round(sa[l.key] * 100)}`);
    add("text", { x: xb + 12, y: yb + 4 }, `${rb[l.key]}. ${l.name} ${Math.round(sb[l.key] * 100)}`);
  }
}

function renderWeights() {
  seg(document.getElementById("presetSeg"), PRESETS.map((k) => [k, t().presets[k]]), state.preset, (k) => {
    state.preset = k; store.set("lb.preset", k); state.weights = Score.presetWeights(k, metrics);
    renderWeights(); renderMatrix(); renderRank(); renderDecision();
  });
  document.getElementById("presetNote").textContent = t().presetDesc[state.preset];
  const box = document.getElementById("weights");
  box.innerHTML = "";
  for (const m of metrics) {
    const lab = document.createElement("label");
    lab.innerHTML = `<span>${label(m)}</span><span><input type="range" min="0" max="3" step="0.5" value="${state.weights[m.key]}"> <output>${+state.weights[m.key].toFixed(2)}</output></span>`;
    const input = lab.querySelector("input");
    input.setAttribute("aria-label", label(m));
    input.oninput = () => {
      state.weights[m.key] = +input.value; lab.querySelector("output").textContent = input.value;
      state.preset = "custom"; document.getElementById("presetNote").textContent = t().presetDesc.custom;
      document.querySelectorAll("#presetSeg button").forEach((b) => b.setAttribute("aria-pressed", false));
      renderMatrix(); renderRank(); renderDecision();
    };
    box.appendChild(lab);
  }
}

function renderDetail() {
  const sel = document.getElementById("metricSel");
  const hidden = hiddenKeys();
  if (hidden.includes(state.metric)) state.metric = "rps";
  sel.innerHTML = metrics.filter((m) => !["pass_rate", "cost_per_pass"].includes(m.key) && !hidden.includes(m.key))
    .map((m) => `<option value="${m.key}" ${m.key === state.metric ? "selected" : ""}>${label(m)}</option>`).join("");
  sel.onchange = () => { state.metric = sel.value; renderDetail(); };
  const m = metrics.find((x) => x.key === state.metric);
  const svg = document.getElementById("detail");
  svg.setAttribute('role', 'group'); svg.setAttribute('aria-label', `${t().detailTitle} · ${label(m)}`);
  const W = Math.max(svg.clientWidth || 600, 320), rowH = 40, top = 16, left = 96, right = 24;
  const H = top + rowH * B.languages.length + 28;
  svg.setAttribute("height", H); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const models = compare() ? B.models.map((x) => x.key) : [state.model];
  const runs = B.runs.filter((r) => +r.pass === 1 && models.includes(r.model) && r[m.key] !== "" && r[m.key] !== undefined)
    .map((r) => ({ ...r, v: RATIO.has(m.key) ? +r[m.key] : +r[m.key] }));
  const NS = "http://www.w3.org/2000/svg";
  svg.innerHTML = "";
  const add = (tag, attrs, text) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); if (text !== undefined) el.textContent = text; svg.appendChild(el); return el; };
  B.languages.forEach((l, i) => {
    const y = top + rowH * i + rowH / 2;
    add("line", { x1: left, x2: W - right, y1: y, y2: y, class: "grid" });
    add("text", { x: 0, y: y + 4 }, l.name);
  });
  if (!runs.length) {
    add("text", { x: left, y: H - 8 }, t().detailEmpty);
  } else {
    const vals = runs.map((r) => r.v);
    const raw = Math.max(...vals) - Math.min(0, ...vals) || 1;
    const p = Math.pow(10, Math.floor(Math.log10(raw / 4)));
    const step = [1, 2, 2.5, 5, 10].map((k) => k * p).find((k) => k * 4 >= raw);
    const lo = Math.floor(Math.min(0, ...vals) / step) * step, hi = lo + step * 4;
    const x = (v) => left + ((v - lo) / (hi - lo)) * (W - left - right);
    const axisY = top + rowH * B.languages.length;
    add("line", { x1: left, x2: W - right, y1: axisY, y2: axisY, class: "axis" });
    for (let k = 0; k <= 4; k++) {
      const v = lo + step * k;
      add("text", { x: x(v), y: axisY + 18, "text-anchor": k === 4 ? "end" : k === 0 ? "start" : "middle" }, fmt(m, v));
    }
    runs.forEach((r) => {
      const i = B.languages.findIndex((l) => l.key === r.language);
      const y = top + rowH * i + rowH / 2 + (r.model === "opus55" ? 7 : -7);
      const color = r.model === "opus55" ? "var(--s2)" : "var(--s1)";
      const dot = r.model === "opus55"
        ? add("rect", { x: x(r.v) - 5, y: y - 5, width: 10, height: 10, rx: 2, fill: color, stroke: "var(--surface)", "stroke-width": 2 })
        : add("circle", { cx: x(r.v), cy: y, r: 5.5, fill: color, stroke: "var(--surface)", "stroke-width": 2 });
      bindTip(dot, `<b>${r.run}</b><br>${label(m)}: ${fmt(m, r.v)}`);
      evidenceAction(dot, {run:r.run,language:r.language,model:r.model,metric:m.key}, `${r.run} · ${label(m)}: ${fmt(m,r.v)}`);
    });
  }
  document.getElementById("detailLegend").innerHTML = B.models.filter((md) => models.includes(md.key)).map((md) =>
    `<span><svg width="14" height="14" style="vertical-align:-2px">${md.key === "opus55"
      ? '<rect x="2" y="2" width="10" height="10" rx="2" fill="var(--s2)"/>'
      : '<circle cx="7" cy="7" r="5.5" fill="var(--s1)"/>'}</svg> ${md.name}</span>`).join("");
  if (models.length === 1) document.getElementById("detailLegend").innerHTML += ` <span>${t().detailHint}</span>`;
}

// 기준선 실험과 다른 시점에 실행한 언어에 "<exp> · <date>" 배지를 붙인다(decision-ui.js의 배지와 같은 마크업).
function expBadge(l) {
  const base = Decision.baselineExp(B.languages, B.experiments);
  if (!base || l.exp === base) return "";
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  return ` <span class="exp-badge">${esc(l.exp)} · ${esc(B.experiments[l.exp]?.date)}</span>`;
}

function renderStack() {
  document.getElementById("stack").innerHTML =
    `<tr><th>${t().lang}</th><th>${t().fw}</th><th>${t().db}</th></tr>` +
    B.languages.map((l) => `<tr><td>${l.name}</td><td>${l.stack.framework}</td><td>${l.stack.db} · SQLite</td></tr>`).join("");
}

document.getElementById("resetW").onclick = () => {
  state.preset = "prereg"; store.set("lb.preset", "prereg");
  state.weights = Score.presetWeights("prereg", metrics);
  renderWeights(); renderMatrix(); renderRank(); renderDecision();
};
function renderDecision() {
  DecisionUI.render({B, state, t:t(), label, fmt, weights:effWeights,
    selectMetric:key => { if (!['pass_rate','cost_per_pass'].includes(key)) { state.metric=key; renderDetail(); } } });
}
function render() { renderText(); renderMatrix(); renderRank(); renderWeights(); renderDetail(); renderStack(); renderDecision(); }
addEventListener("resize", () => { renderDetail(); renderRank(); });
render();
</script>
</body>
