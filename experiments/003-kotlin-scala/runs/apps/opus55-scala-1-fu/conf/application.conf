# Application wiring (compile-time dependency injection).
play.application.loader = realworld.AppLoader

play.http.secret.key = "change-me-this-is-a-default-development-secret-key-0123456789"
play.http.secret.key = ${?APPLICATION_SECRET}

# HTTP port: defaults to 8000, overridden by the PORT environment variable.
play.server.http.port = 8000
play.server.http.port = ${?PORT}
play.server.http.address = "0.0.0.0"

# Do not write a RUNNING_PID file (it breaks container restarts).
play.server.pidfile.path = /dev/null

play.http.parser.maxMemoryBuffer = 1MB

play.filters.cors {
  allowedOrigins = null
  allowedHttpMethods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allowedHttpHeaders = null
  preflightMaxAge = 1 hour
}

realworld {
  # SQLite database file location.
  db.path = "data/realworld.db"
  db.path = ${?DATABASE_PATH}

  jwt.secret = "change-me-jwt-secret-for-development-only-0123456789abcdef"
  jwt.secret = ${?JWT_SECRET}
  jwt.ttl-hours = 720

  # PBKDF2-HMAC-SHA256 work factor for password hashing.
  password.iterations = 10000
  password.iterations = ${?PASSWORD_ITERATIONS}
}
