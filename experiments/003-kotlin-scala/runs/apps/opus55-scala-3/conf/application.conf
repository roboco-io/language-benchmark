# Compile-time dependency injection (see app/realworld/AppLoader.scala).
play.application.loader = realworld.AppLoader

play.http.secret.key = "change-me-please-this-is-a-development-only-secret-key-0123456789"
play.http.secret.key = ${?APPLICATION_SECRET}

http.port = 8000
http.port = ${?PORT}

realworld {
  db.path = "data/realworld.db"
  db.path = ${?DATABASE_PATH}
  jwt.secret = "realworld-jwt-development-secret-change-me"
  jwt.secret = ${?JWT_SECRET}
  jwt.ttl-days = 30
}

play.filters.cors {
  allowedOrigins = null
  allowedHttpMethods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allowedHttpHeaders = null
}

# Size Pekko's thread pools to exactly the number of available CPU cores.
# fork-join parallelism = ceil(cores * factor), clamped to [min, max].
# The Pekko HTTP server used by Play runs on the default dispatcher.
pekko.actor.default-dispatcher {
  executor = "fork-join-executor"
  fork-join-executor {
    parallelism-factor = 1.0
    parallelism-min = 1
    parallelism-max = 4096
  }
}
pekko.actor.internal-dispatcher {
  executor = "fork-join-executor"
  fork-join-executor {
    parallelism-factor = 1.0
    parallelism-min = 1
    parallelism-max = 4096
  }
}

play.server.pekko.max-header-size = 16k
