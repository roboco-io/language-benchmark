spring.application.name=realworld
server.port=${PORT:8080}

# SQLite: WAL journal, 5000 ms busy timeout, IMMEDIATE transactions to avoid
# lock-upgrade deadlocks between concurrent writers.
app.db.path=${DATABASE_PATH:realworld.db}
spring.datasource.url=jdbc:sqlite:${app.db.path}?journal_mode=WAL&busy_timeout=5000&synchronous=NORMAL&foreign_keys=true&transaction_mode=IMMEDIATE
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=5000

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET:realworld-default-secret-change-me-in-production-please}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:2592000}
