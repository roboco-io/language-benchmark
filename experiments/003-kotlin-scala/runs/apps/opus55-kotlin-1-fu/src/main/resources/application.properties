server.port=${PORT:8080}
spring.main.banner-mode=off

# SQLite: WAL journal mode and a 5000 ms busy timeout are applied to every connection.
spring.datasource.url=jdbc:sqlite:${DATABASE_PATH:realworld.db}?journal_mode=WAL&busy_timeout=5000&foreign_keys=true
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# The schema is created on startup when the database is empty (all statements use IF NOT EXISTS).
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.jackson.default-property-inclusion=always
