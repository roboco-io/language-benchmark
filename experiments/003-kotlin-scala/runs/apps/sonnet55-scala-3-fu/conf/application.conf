# Application configuration. Environment variables override the defaults below.

play.http.secret.key = "change-this-secret-in-production-0123456789abcdef"
play.http.secret.key = ${?APPLICATION_SECRET}

play.server.http.port = 9000
play.server.http.port = ${?PORT}
play.server.http.address = "0.0.0.0"
play.server.pidfile.path = "/dev/null"

play.modules.enabled += "services.DbModule"
play.http.errorHandler = "common.JsonErrorHandler"

# Secret used to sign JWT tokens (HS256).
app.jwt.secret = "change-this-jwt-secret-in-production-0123456789abcdef"
app.jwt.secret = ${?JWT_SECRET}
app.jwt.ttlDays = 30

# SQLite database file. The schema is created at startup when the database is empty.
app.db.path = "data/realworld.db"
app.db.path = ${?DB_PATH}

# The default dispatcher (used by the Pekko HTTP server and Play actions) gets exactly one
# thread per available CPU core: factor 1.0 applied to the core count, with permissive bounds.
pekko.actor.default-dispatcher.fork-join-executor {
  parallelism-factor = 1.0
  parallelism-min = 1
  parallelism-max = 1024
}

# This is a token-authenticated JSON API: no cookies, so CSRF/host/security-header filters do not apply.
play.filters.enabled = []
