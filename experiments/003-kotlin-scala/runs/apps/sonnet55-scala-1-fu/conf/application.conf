# Number of CPU cores. start.sh / the Docker entrypoint export CORES=$(nproc).
# The fallback below is only used if the variable is missing.
cores = 4
cores = ${?CORES}

play.http.secret.key = "change-me-realworld-dev-secret-key-0123456789abcdef"
play.http.secret.key = ${?APPLICATION_SECRET}

# JWT signing secret (HS256)
realworld.jwt.secret = ${play.http.secret.key}
realworld.jwt.ttl-hours = 72

play.modules.enabled += "services.DbInitModule"

# The API needs no CSRF / allowed-hosts filters.
play.filters.enabled = []
play.http.errorHandler = "services.JsonErrorHandler"

# Default dispatcher sized to the core count.
pekko.actor.default-dispatcher {
  fork-join-executor {
    parallelism-min = ${cores}
    parallelism-factor = 1.0
    parallelism-max = ${cores}
  }
}

# Play's own execution contexts also use the default dispatcher.
play.akka.actor.default-dispatcher = ${pekko.actor.default-dispatcher}

# Pekko HTTP server
pekko.http.server {
  server-header = ""
  parsing.max-content-length = 10m
}
play.server.max-content-length = 10m

# Slick + SQLite (WAL mode, busy_timeout 5000 ms)
slick.dbs.default {
  profile = "slick.jdbc.SQLiteProfile$"
  db {
    driver = "org.sqlite.JDBC"
    url = "jdbc:sqlite:realworld.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=true&synchronous=NORMAL"
    url = ${?DATABASE_URL}
    numThreads = ${cores}
    maxConnections = ${cores}
    minConnections = ${cores}
    queueSize = 10000
    connectionTimeout = 30000
  }
}
