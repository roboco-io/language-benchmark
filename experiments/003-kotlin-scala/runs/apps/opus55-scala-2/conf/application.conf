# Compile-time dependency injection (see realworld.AppLoader).
play.application.loader = "realworld.AppLoader"

# HTTP port: taken from the PORT environment variable, 8080 by default.
http.port = 8080
http.port = ${?PORT}
play.server.http.port = ${http.port}
play.server.http.address = "0.0.0.0"

play.http.secret.key = "realworld-default-application-secret-change-me-0123456789"
play.http.secret.key = ${?APPLICATION_SECRET}

play.filters.cors {
  allowedOrigins = null
  allowedHttpMethods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allowedHttpHeaders = null
}

realworld {
  jwt {
    secret = "realworld-default-jwt-secret-change-me-0123456789abcdef"
    secret = ${?JWT_SECRET}
    ttl-seconds = 2592000
  }
  db {
    # Path of the SQLite database file. Its parent directory is created on startup.
    path = "data/realworld.db"
    path = ${?DATABASE_PATH}
  }
}

# Thread pools sized to the number of available CPU cores.
# parallelism = ceil(cores * factor), clamped to [min, max]; with factor 1.0,
# min 1 and a large max this is exactly the core count.
# Play's Pekko HTTP server runs its request handling on the default dispatcher.
pekko.actor.default-dispatcher {
  executor = "fork-join-executor"
  fork-join-executor {
    parallelism-factor = 1.0
    parallelism-min = 1
    parallelism-max = 32767
  }
}
pekko.actor.internal-dispatcher {
  executor = "fork-join-executor"
  fork-join-executor {
    parallelism-factor = 1.0
    parallelism-min = 1
    parallelism-max = 32767
  }
}
