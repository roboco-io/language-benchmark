# RealWorld backend configuration.

play.http.secret.key = "realworld-default-secret-change-me-in-production-0123456789abcdef"
play.http.secret.key = ${?APPLICATION_SECRET}

# The port comes from the PORT environment variable (default 8000).
play.server.http.port = 8000
play.server.http.port = ${?PORT}
play.server.http.address = "0.0.0.0"

# No hosts/CSRF filters: this is a stateless JSON API authenticated by token.
play.filters.enabled = []

# Size every thread pool to the number of available cores:
# parallelism = ceil(cores * factor), clamped to [min, max].
pekko.actor.default-dispatcher.fork-join-executor {
  parallelism-factor = 1.0
  parallelism-min = 1
  parallelism-max = 1024
}
play.server.pekko.http.server.pipelining-limit = 16

realworld {
  jwt.secret = ${play.http.secret.key}
  jwt.ttl-seconds = 604800
  db {
    path = "realworld.db"
    path = ${?DB_PATH}
  }
}
