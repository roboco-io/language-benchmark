server.port=${PORT:8080}
spring.datasource.url=jdbc:sqlite:${DB_PATH:realworld.db}?journal_mode=WAL&busy_timeout=5000&synchronous=NORMAL&foreign_keys=ON
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.main.banner-mode=off
app.jwt.secret=${JWT_SECRET:realworld-dev-secret-change-me-realworld-dev-secret}
app.jwt.ttl-seconds=604800
