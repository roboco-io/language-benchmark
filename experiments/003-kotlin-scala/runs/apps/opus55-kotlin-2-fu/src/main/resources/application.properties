spring.application.name=realworld
server.port=${PORT:8080}
server.error.whitelabel.enabled=false

# SQLite database; WAL journal mode and a 5000 ms busy timeout are applied to every connection.
realworld.db-path=${DB_PATH:./data/realworld.db}
spring.datasource.url=jdbc:sqlite:${realworld.db-path}?journal_mode=WAL&busy_timeout=5000&foreign_keys=true
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=5000

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Creates the schema on an empty database and keeps it in sync on later starts.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

realworld.jwt-secret=${JWT_SECRET:<REDACTED:JWT_SECRET>}
realworld.jwt-ttl-seconds=${JWT_TTL_SECONDS:2592000}
