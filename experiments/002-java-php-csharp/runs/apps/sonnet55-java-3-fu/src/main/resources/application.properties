server.port=${PORT:8080}
spring.application.name=realworld

# SQLite: WAL mode and a 5000 ms busy timeout are set through the JDBC URL properties.
# The database file location can be overridden with DB_PATH.
spring.datasource.url=jdbc:sqlite:${DB_PATH:realworld.db}?journal_mode=WAL&busy_timeout=5000&synchronous=NORMAL&foreign_keys=true
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate creates the schema when the database is empty.
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.main.banner-mode=off
server.tomcat.accesslog.enabled=false
