server.port=${PORT:8080}
spring.main.banner-mode=off
spring.jpa.open-in-view=false

# SQLite: WAL journal and a 5000 ms busy timeout. Writers are serialized in-process
# by SqliteTransactionManager.
spring.datasource.url=jdbc:sqlite:${DATABASE_PATH:realworld.db}?journal_mode=WAL&busy_timeout=5000&foreign_keys=true
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Creates the schema on an empty database (and keeps it in sync on later starts).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=${JWT_SECRET:<REDACTED:JWT_SECRET>}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:2592000}
spring.jpa.properties.hibernate.default_batch_fetch_size=64
