server.port=${PORT:8080}
# Tomcat thread pool size and Hikari pool size are set to the CPU core count in Application.java.

# SQLite: WAL journal, 5000 ms busy timeout. IMMEDIATE transactions avoid SQLITE_BUSY on read-to-write upgrades.
spring.datasource.url=jdbc:sqlite:${DB_PATH:./data/realworld.db}?journal_mode=WAL&busy_timeout=5000&synchronous=NORMAL&foreign_keys=true&transaction_mode=IMMEDIATE&date_class=TEXT
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.main.banner-mode=off
spring.jackson.default-property-inclusion=always

app.jwt.secret=${JWT_SECRET:<REDACTED:JWT_SECRET>}
