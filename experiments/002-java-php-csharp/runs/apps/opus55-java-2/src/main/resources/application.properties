server.port=${PORT:8080}
server.error.whitelabel.enabled=false
spring.main.banner-mode=off

# SQLite: WAL journal mode and a 5000 ms busy timeout are applied on every pooled connection.
spring.datasource.url=jdbc:sqlite:${DB_PATH:realworld.db}?journal_mode=WAL&busy_timeout=5000&foreign_keys=true
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.default-property-inclusion=always
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

jwt.secret=${JWT_SECRET:<REDACTED:JWT_SECRET>}
jwt.ttl-seconds=${JWT_TTL_SECONDS:2592000}
