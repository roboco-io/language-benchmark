server.port=${PORT:8080}
spring.main.banner-mode=off

# SQLite: WAL journal and a 5000 ms busy timeout are applied to every connection via the JDBC URL.
app.db.path=${DB_PATH:data/realworld.db}
spring.datasource.url=jdbc:sqlite:${app.db.path}?journal_mode=WAL&busy_timeout=5000&foreign_keys=true
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100

app.jwt.secret=${JWT_SECRET:realworld-default-development-secret-change-me-in-production}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:2592000}
