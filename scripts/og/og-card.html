<html><head><meta charset="utf-8">

p{font-size:30px;color:#c3c2b7;margin-top:16px;max-width:980px;line-height:1.35}
.langs{display:flex;gap:14px;flex-wrap:wrap}
.langs span{font-size:30px;font-weight:600;padding:10px 22px;border-radius:12px;background:#1a1a19;border:2px solid #2c2c2a}
.foot{display:flex;justify-content:space-between;font-size:24px;color:#898781}
</style></head>
<body>

<div class="foot"><span id="runs"></span><span>roboco.io/language-benchmark</span></div>
<script src="data.js"></script>
<script>
const B = window.BENCH;
document.getElementById("nlang").textContent = B.languages.length;
document.getElementById("langs").innerHTML = B.languages.map((l) => `<span>${l.name}</span>`).join("");
const passed = B.runs.filter((r) => +r.pass === 1).length;
document.getElementById("runs").textContent = B.runs.length ? `${B.runs.length} runs · ${passed} passed` : "Experiments in progress";
</script>
